Worker:
  ID: "${JUDGE_WORKER_ID}"
  Concurrency: 4
  QueueCapacity: 128

LanguageRegistryFile: "${JUDGE_LANGUAGE_REGISTRY_FILE}"

# These targets are validated now and will be used when RPC orchestration is
# introduced. This skeleton does not dial either service.
SubmitRPC:
  Target: "${JUDGE_SUBMIT_RPC_TARGET}"
ProblemRPC:
  Target: "${JUDGE_PROBLEM_RPC_TARGET}"

InternalAuth:
  Name: "judge.worker"
  SubmitToken: "${SUBMIT_INTERNAL_JUDGE_TOKEN}"
  ProblemToken: "${PROBLEM_INTERNAL_JUDGE_TOKEN}"

TestDataCache:
  Dir: "${JUDGE_TEST_DATA_CACHE_DIR}"
  MaxBytes: 21474836480
  TTLSeconds: 86400
  CleanupIntervalSeconds: 600
  MaxDownloadBytes: 536870912
  MaxUncompressedBytes: 2147483648
  MaxFileBytes: 536870912
  MaxFileCount: 20000
  MaxManifestBytes: 2097152
  MaxCompressionRatio: 200

# Use a dedicated identity whose bucket policy permits GetObject only. The
# worker code exposes no upload or delete operation.
ObjectStorage:
  Endpoint: "${JUDGE_OBJECT_STORAGE_ENDPOINT}"
  Region: "${JUDGE_OBJECT_STORAGE_REGION}"
  Bucket: "${JUDGE_OBJECT_STORAGE_BUCKET}"
  AccessKey: "${JUDGE_OBJECT_STORAGE_ACCESS_KEY}"
  SecretKey: "${JUDGE_OBJECT_STORAGE_SECRET_KEY}"
  UsePathStyle: true
  RequestTimeoutSeconds: 60

# Docker images are provisioned by operators and must be pinned by digest or
# immutable version. The worker never pulls images from an untrusted request.
Sandbox:
  Driver: "docker"
  WorkDir: "${JUDGE_SANDBOX_WORK_DIR}"
  Docker:
    Endpoint: "${JUDGE_DOCKER_ENDPOINT}"
    User: "65532:65532"
    APITimeoutSeconds: 10
    StopTimeoutSeconds: 5
    NanoCPUs: 1000000000

Log:
  Level: "info"
  Format: "text"
  AddSource: false

# Metrics exposure is reserved for a follow-up Issue; keeping the address and
# path here makes the future component part of the validated configuration.
Metrics:
  Enabled: false
  ListenOn: "127.0.0.1:9100"
  Path: "/metrics"

Timeouts:
  RPCSeconds: 5
  TaskSeconds: 300
  ShutdownSeconds: 30
