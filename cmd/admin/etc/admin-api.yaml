  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: problem.rpc

ContestRPC:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: contest.rpc

SubmitRPC:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: submit.rpc
