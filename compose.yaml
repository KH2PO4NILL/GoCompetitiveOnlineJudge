name: go-competitive-online-judge

services:
  rocketmq-storage-init:
    image: apache/rocketmq:5.1.4
    user: "0:0"
    entrypoint: ["chown", "3000:3000", "/home/rocketmq/store"]
    volumes:
      - rocketmq_store:/home/rocketmq/store

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    command: sh mqbroker --enable-proxy -n rocketmq-namesrv:9876 -bc /etc/rocketmq/broker.conf -pc /etc/rocketmq/proxy.json
    depends_on:
      rocketmq-storage-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "127.0.0.1:${ROCKETMQ_PROXY_PORT:-18081}:18081"
      - "127.0.0.1:${ROCKETMQ_BROKER_PORT:-10911}:10911"
    volumes:
      - ./infra/rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
      - ./infra/rocketmq/proxy.json:/etc/rocketmq/proxy.json:ro
      - rocketmq_store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/18081'"]
      interval: 5s
      timeout: 3s
      retries: 40

  rocketmq-init:
    image: apache/rocketmq:5.1.4
    profiles: [init]
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t judge-task -r 4 -w 4 -a '+message.type=NORMAL' &&
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t judge-task-dead -r 1 -w 1 -a '+message.type=NORMAL' &&
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -g judge-workers
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-migrate:
    image: mysql:8.4
    profiles:
      - init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./infra/mysql/migrate.sh:/migrate.sh:ro
      - ./services/grpc/auth/migrations:/migrations/auth:ro
      - ./services/grpc/problem/migrations:/migrations/problem:ro
      - ./services/grpc/contest/migrations:/migrations/contest:ro
      - ./services/grpc/submit/migrations:/migrations/submit:ro
    entrypoint:
      - /bin/sh
      - /migrate.sh

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.33
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=default=http://127.0.0.1:2380
      - --initial-cluster-state=new
    ports:
      - "127.0.0.1:${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # 使用 MinIO 官方 Quay 仓库，绕过 Docker Hub 镜像加速源拉取不稳定的问题。
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # mc 也必须使用同一官方源，否则初始化 Bucket 时仍会访问 Docker Hub。
    image: quay.io/minio/mc:latest
    profiles:
      - init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-problem-test-data}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$MINIO_BUCKET"

volumes:
  rocketmq_store:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
